fiendSkillBlind:
  key: fiendSkillBlind
  text: When summoned, the {fiendName} Fiend gives {blind} accuracy for its owner
    as long as the target has {fiendName} Fiends. This effect can’t be cleansed. (Chance
    to miss also applies to offensive Special Skills.)
  vars:
    fiendName: ""
    blind: -35%
  types:
  - Accuracy Debuff Fiend
gambler_1managen3_2dropto1:
  key: gambler_1managen3_2dropto1
