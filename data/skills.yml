  types:
  - Extra Elemental Damage
fear3:
  key: fear3
  text: The target and nearby enemies succumb to Fear for {turns} turns. (The target
    gets {def} defense. Removes all dispellable buffs and Growth effects when a Fear
    status effect is added. The target cannot gain new buffs or Growth effects for
    the duration. Target with Fear deals {hit} damage to a random ally each time any
    other ally casts their Special Skill. Each character can trigger this effect once
    per turn.)
  vars:
    turns: 5
    def: -40%
    hit: 250%
  types:
  - Fear 3
fiendAbsorbs:
  key: fiendAbsorbs
  text: The {fiendName} Fiend absorbs healing. It disappears after absorbing a healing
    amount equal to {absorbs} of its target’s max health.
  vars:
    fiendName: ""
    absorbs: 40%
  types:
