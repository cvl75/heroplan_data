  key: ds_zhura
  title: Overcharged Plunge
  text: |-
    @hit1#hit=340%@
    @boostManaSelfOnKill#mana=25%@
    @ssExtraDmg3#extra=+40%;turns=3@
    @extraElemDmg#elem=Dark@
info_manaAdditions:
  key: info_manaAdditions
  text: After a character has received {count} direct mana additions from Special
    Skill during a single turn, all subsequent direct mana additions done by Special
    Skills will have reduced power on that character.
  vars:
    count: 5
attackDebuff1:
  key: attackDebuff1
  text: The target gets {attdebuff} attack for {turns} turns.
  vars:
    attdebuff: -3500
    turns: 3
  types:
  - Attack Debuff 1
blazingRaveDance:
  key: blazingRaveDance
  text: |-
    Blazing Rave Dance
     * {def} defense.
     * If any dancer is hit with direct damage from Special Skill, Blazing Rave Dance is extended by {turns} for all dancers. The dance can only be extended once per turn. (All existing status effect will be removed when a dance status effect is added. Dance gives immunity to new status effects. New dance status effect will replace this effect. Dance effect cannot be dispelled. The effect is removed when the caster is defeated.)
  vars:
    def: +50%
    turns: 1 turn
  types:
  - Defense Buff while dancing
  - Extend Dance if hit by SS
boostManaSelfOnKill:
  key: boostManaSelfOnKill
  text: If the target is defeated by the attack, the caster gains {mana} mana. (@info_manaAdditions@)
  vars:
    mana: 25%
  types:
  - Boost Mana Self on kill
cleanseImmunityAll:
  key: cleanseImmunityAll
  text: All enemies can't get their status ailments cleansed or reallocated by Special
    Skills for {turns} turns.
  vars:
    turns: 5
  types:
  - Cleanse Immunity Debuff All
da_crackingBlaze:
  key: da_crackingBlaze
  icon: /img/skills/assist_dragon_cracking_blaze_cretrix.webp
  title: Cracking Blaze
  text: |-
    @hitAll#hit=210@
    @healerAll#heal=110@
    @dotAll#dot=360;type=Burn;turns=5@
    @defenseDebuffAll#defDebuff=-15%;turns=5@
da_sacredFlame:
  key: da_sacredFlame
  icon: /img/skills/assist_dragon_sacred_flame_florin.webp
