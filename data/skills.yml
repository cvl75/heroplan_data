    @healerAll#heal=230@
    @healFromDmgAll#healp=40%;turns=5@
    @cleanserAll#@
dance4:
  key: dance4
  text: All allies except the caster dance the {dance} for {turns} turns.
  vars:
    dance: Blazing Rave Dance
    turns: 3
  types:
  - '{dance} 4'
dealsExtra:
