    The caster and nearby allies get {managen} mana generation for {manaturns} turns.
    Alternative 2:
    The caster and nearby allies have a {dropchance} chance to drop any received damage to 1 for {dropturns} turns.
  vars:
    managen: +20%
    manaturns: 3
    dropchance: 20%
    dropturns: 3
  types:
  - Gambler
  - Mana Generation Buff 3
  - Damage Drop to 1 Chance 3
